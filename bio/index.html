<!doctype html>
<html lang="es" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketographers - Links</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "cream": "#faf9f6",
            "cream-alt": "#f1efe9",
            "ink": "#141414",
            "gold": "#F5B729",
            "gold-hover": "#e0a61f",
            "red": "#C23B26",
            "muted": "#68655f"
          }
        }
      }
    }
  </script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/global.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #faf9f6;
      background-image:
        radial-gradient(rgba(20,20,20,.08) 1.4px, transparent 1.4px),
        linear-gradient(rgba(245,183,41,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,183,41,.05) 1px, transparent 1px);
      background-size: 26px 26px, 60px 60px, 60px 60px;
      color: #141414;
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: -0.01em;
    }

    .gradient-text {
      background: linear-gradient(135deg, #F5B729 0%, #C23B26 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-slide-up { animation: slide-up 0.8s ease-out forwards; }
    .animate-fade-in { animation: fade-in 1s ease-out forwards; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }

    .card-hover {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgba(20,20,20,0.15);
    }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
 </head>
 <body class="h-full overflow-auto">
  <div id="app-wrapper" class="w-full h-full relative">
   <div class="w-full h-full flex items-center justify-center overflow-hidden">
    <div class="absolute top-1/4 left-10 w-72 h-72 bg-[#F5B729]/10 rounded-full blur-[100px] animate-float"></div>
    <div class="absolute bottom-1/4 right-10 w-96 h-96 bg-[#C23B26]/5 rounded-full blur-[120px] animate-float delay-300"></div>
    <div class="max-w-2xl w-full mx-auto px-6 text-center relative z-10">
     <!-- Heading -->
     <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold leading-tight mb-8 animate-slide-up"><span class="text-ink">Elige tu</span> <span class="gradient-text">camino</span></h1>
     <!-- Buttons -->
     <div class="space-y-6 animate-slide-up delay-200 max-w-lg mx-auto">
      <!-- Button 1: Comunidad -->
      <a href="https://marketographers.com/" target="_blank" rel="noopener noreferrer" class="block">
       <div class="card-hover rounded-2xl p-8 bg-white border-2 border-ink/10 hover:border-gold/60 transition-all group">
        <div class="flex items-center justify-between gap-4">
         <div class="text-left flex-1">
          <div class="flex items-center gap-3 mb-2">
           <div class="w-8 h-8 rounded-lg bg-gold/15 flex items-center justify-center">
            <svg class="w-5 h-5" style="color:#a3720f;" fill="currentColor" viewbox="0 0 24 24">
             <path d="M12 0c1.5 0 2 1 2 2.5V4h2.5C17 4 18 5 18 6v2h1.5c.8 0 1.5.7 1.5 1.5v10c0 .8-.7 1.5-1.5 1.5H3.5c-.8 0-1.5-.7-1.5-1.5v-10C2 8.7 2.7 8 3.5 8H5V6c0-1 1-2 2.5-2H10V2.5C10 1 10.5 0 12 0zm-1 4v1h2V4h-2z" />
            </svg>
           </div>
           <h2 class="text-lg md:text-xl font-bold text-ink">Clases en vivo</h2>
          </div>
          <p class="text-muted text-sm">Acceso a recursos y clases de marketing, en vivo por Zoom.</p>
          <p class="text-muted text-xs mt-2 opacity-70">Para fotógrafos / filmmakers</p>
         </div>
         <div class="text-gold-hover group-hover:translate-x-2 transition-transform flex-shrink-0" style="color:#a3720f;">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
         </div>
        </div>
       </div>
      </a>
      <!-- Button 2: Nas afiliado -->
      <a href="https://nas.com/referral?code=MOTION_MARKETING_PARA_FOTGRAFOS" target="_blank" rel="noopener noreferrer" class="block">
       <div class="card-hover rounded-2xl p-8 bg-white border-2 border-ink/10 hover:border-red/40 transition-all group">
        <div class="flex items-center justify-between gap-4">
         <div class="text-left flex-1">
          <div class="flex items-center gap-3 mb-2">
           <div class="w-8 h-8 rounded-lg bg-red/10 flex items-center justify-center">
            <svg class="w-5 h-5 text-red" fill="currentColor" viewbox="0 0 24 24">
             <path d="M12 2C9.24 2 7 4.24 7 7c0 2.31 1.83 4.23 4 4.48V13H9v2h2v3h2v-3h2v-2h-2V11.48c2.17-.25 4-2.17 4-4.48 0-2.76-2.24-5-5-5zm0 8c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm-4 6h8v2H8z" />
            </svg>
           </div>
           <h2 class="text-lg md:text-xl font-bold text-ink">Crea tu comunidad</h2>
          </div>
          <p class="text-muted text-sm">Herramientas de Nas.io para crear tu propio proyecto</p>
          <p class="text-muted text-xs mt-2 opacity-70">Para creadores / emprendedores</p>
         </div>
         <div class="text-red group-hover:translate-x-2 transition-transform flex-shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
         </div>
        </div>
       </div>
      </a>
     </div>
     <!-- Footer text -->
     <p class="text-muted text-xs mt-12 animate-fade-in delay-300 opacity-70">© 2026 Marketographers.</p>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {};

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {},
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([])
      });
    }
  </script>
 </body>
</html>
