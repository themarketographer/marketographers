<body>
<header class="wrap nav">
  <a class="brand" href="/marketools/">MarkeTools</a>
  <a class="btn btn-secondary" href="/masterclass/" data-cta="clave-del-mes-nav">Clase gratis</a>
</header>
<main class="wrap tool">
  <header>
    <h1>Clave del mes</h1>
    <p>Esta página es solo para ti. Muestra la clave de las herramientas premium de este mes y la del mes que viene, para que la fijes en la comunidad.</p>
  </header>
  
  <div id="app">
    <form class="card stack" id="f" style="max-width:440px">
      <div class="field"><label for="sec">Secreto (el valor de MK_PREMIUM_SECRETO en Netlify)</label><input class="input" id="sec" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Ver claves</button>
      <p class="field-error" id="err" role="alert" hidden></p>
    </form>
    <section class="card stack" id="res" hidden style="max-width:560px;margin-top:var(--s5)"></section>
  </div>
</main>
<footer class="wrap foot"><span>Una herramienta de <a href="/">The Marketographers</a>, por Pablo Villarroel.</span><a href="/marketools/">Ver todas las herramientas</a></footer>
<script src="/marketools/_ui/tool.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var err = document.getElementById('err'); err.hidden = true;
  fetch('/.netlify/functions/premium', { headers: { Authorization: 'Bearer ' + document.getElementById('sec').value.trim() } }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r.ok) { err.textContent = r.error || 'No se pudo.'; err.hidden = false; return; }
    var msg = 'Clave de las MarkeTools premium de este mes: ' + r.clave + '\nEntra en marketographers.com/marketools/contrato/ y pégala. Cambia el día 1.';
    var res = document.getElementById('res'); res.hidden = false;
    res.innerHTML = '<div><p class="muted">Este mes (' + r.mes + ')</p><p class="big">' + r.clave + '</p></div><div class="kv"><span>Mes que viene (' + r.proximoMes + ')</span><span>' + r.proxima + '</span></div><p class="msg" id="m"></p><button type="button" class="btn btn-secondary" id="c">Copiar mensaje para la comunidad</button>';
    document.getElementById('m').textContent = msg;
    document.getElementById('c').addEventListener('click', function () { Tool.copy(msg, this); });
  }).catch(function () { err.textContent = 'No hay conexión.'; err.hidden = false; });
});
</script>
</body>
